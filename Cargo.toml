[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rubrik Chess rules engine and multiplayer server"
repository = "https://github.com/phanthh/rubrikchess"
homepage = "https://github.com/phanthh/rubrikchess"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
